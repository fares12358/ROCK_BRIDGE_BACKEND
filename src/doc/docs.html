<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Bridge API Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .method-post { background-color: #4ade80; color: #064e3b; }
        .method-get { background-color: #60a5fa; color: #1e3a8a; }
        .method-delete { background-color: #f87171; color: #7f1d1d; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-5xl mx-auto px-4 py-12">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Rock Bridge API Documentation</h1>
            <p class="text-lg text-gray-600">Comprehensive guide to the Rock Bridge backend API endpoints and integration.</p>
        </header>

        <!-- Auth Section -->
        <section class="mb-16">
            <div class="flex items-center mb-6">
                <div class="p-2 bg-blue-100 rounded-lg mr-4">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold">Authentication</h2>
            </div>
            <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200">
                            <th class="px-6 py-4 font-semibold text-sm text-gray-700">Method</th>
                            <th class="px-6 py-4 font-semibold text-sm text-gray-700">Endpoint</th>
                            <th class="px-6 py-4 font-semibold text-sm text-gray-700">Description</th>
                            <th class="px-6 py-4 font-semibold text-sm text-gray-700">Auth</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr>
                            <td class="px-6 py-4"><span class="px-2 py-1 rounded text-xs font-bold method-post">POST</span></td>
                            <td class="px-6 py-4 font-mono text-sm">/api/auth/login</td>
                            <td class="px-6 py-4 text-sm">Authenticate user and receive tokens</td>
                            <td class="px-6 py-4 text-sm text-gray-500">None</td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4"><span class="px-2 py-1 rounded text-xs font-bold method-post">POST</span></td>
                            <td class="px-6 py-4 font-mono text-sm">/api/auth/relogin</td>
                            <td class="px-6 py-4 text-sm">Refresh access token using refresh token</td>
                            <td class="px-6 py-4 text-sm text-gray-500">Refresh Token</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Other API Sections can be added here -->
    </div>
</body>
</html>
